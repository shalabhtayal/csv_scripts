<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YC Email Generator with Deepseek API</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, hsl(158 65% 25%), hsl(158 55% 35%), hsl(45 70% 55%));
            --secondary-gradient: linear-gradient(135deg, hsl(158 55% 35%), hsl(45 70% 55%));
            --primary-color: hsl(158 65% 25%);
            --secondary-color: hsl(45 70% 55%);
            --success-color: hsl(158 65% 35%);
            --danger-color: hsl(0 70% 55%);
            --warning-color: hsl(45 70% 55%);
            --info-color: hsl(200 70% 55%);
            --light-bg: #f8f9fa;
            --card-shadow: 0 10px 30px rgba(0,0,0,0.08);
            --transition: all 0.3s ease;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        
        body {
            background: var(--primary-gradient);
            color: #333;
            padding: 15px;
            min-height: 100vh;
            font-size: 14px;
        }
        
        .container {
            max-width: 1800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        header {
            background: var(--secondary-gradient);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            margin-bottom: 8px;
            font-weight: 800;
        }
        
        .subtitle {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            opacity: 0.9;
        }
        
        .main-content {
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }
        
        @media (min-width: 768px) {
            .main-content {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
        }
        
        .panel {
            background: var(--light-bg);
            border-radius: 15px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            border: 1px solid #e9ecef;
        }
        
        .panel-title {
            font-size: 1.3rem;
            color: #2d3436;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 3px solid var(--primary-color);
            font-weight: 700;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #495057;
            font-size: 0.9rem;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: var(--transition);
            background: white;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.1);
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
            font-family: 'Courier New', monospace;
            line-height: 1.4;
        }
        
        .upload-area {
            border: 3px dashed #adb5bd;
            border-radius: 8px;
            padding: 30px 15px;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .upload-area:hover {
            border-color: var(--primary-color);
            background: #f8f9ff;
        }
        
        .upload-icon {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        
        .control-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        
        @media (min-width: 480px) {
            .control-buttons {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        .btn {
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
        }
        
        .btn-primary {
            background: var(--secondary-gradient);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(106, 17, 203, 0.3);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-danger {
            background: var(--danger-color);
            color: white;
        }
        
        .btn-success {
            background: var(--success-color);
            color: white;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }
        
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid #e9ecef;
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-color);
            line-height: 1;
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .progress-section {
            margin: 20px 0;
        }
        
        .progress-bar {
            height: 16px;
            background: #e9ecef;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 8px;
        }
        
        .charts-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        
        @media (min-width: 768px) {
            .charts-container {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        .chart-box {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            height: 250px;
        }
        
        .chart-box canvas {
            width: 100% !important;
            height: 100% !important;
        }
        
        .data-container {
            overflow-x: auto;
            margin: 15px -20px -20px;
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }
        
        .data-table th {
            background: var(--secondary-gradient);
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            position: sticky;
            top: 0;
        }
        
        .data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e9ecef;
            font-size: 0.85rem;
            vertical-align: top;
        }
        
        .data-table tr:hover {
            background: var(--light-bg);
        }
        
        .log-container {
            background: #1a1a1a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 12px;
            border-radius: 8px;
            height: 180px;
            overflow-y: auto;
            margin-top: 15px;
            font-size: 0.8rem;
        }
        
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #333;
            word-break: break-word;
        }
        
        .log-time {
            color: #888;
        }
        
        .log-success {
            color: var(--success-color);
        }
        
        .log-error {
            color: var(--danger-color);
        }
        
        .log-warning {
            color: var(--warning-color);
        }
        
        .rate-control {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        
        @media (min-width: 480px) {
            .rate-control {
                flex-direction: row;
                align-items: center;
            }
        }
        
        .rate-control input {
            width: 100px;
        }
        
        .campaign-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            background: #fff3cd;
            border: 1px solid #ffeaa7;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #6c757d;
        }
        
        .status-active {
            background: var(--success-color);
            animation: pulse 1.5s infinite;
        }
        
        .status-paused {
            background: var(--warning-color);
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .company-count {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 8px;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            border: 1px solid #f5c6cb;
            font-size: 0.9rem;
        }
        
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            border: 1px solid #c3e6cb;
            font-size: 0.9rem;
        }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .mobile-only {
            display: block;
        }
        
        .desktop-only {
            display: none;
        }
        
        @media (min-width: 768px) {
            .mobile-only {
                display: none;
            }
            .desktop-only {
                display: block;
            }
        }
        
        .collapsible-section {
            margin-bottom: 15px;
        }
        
        .collapsible-header {
            background: white;
            border: 1px solid #dee2e6;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }
        
        .collapsible-content {
            padding: 15px;
            background: white;
            border: 1px solid #dee2e6;
            border-top: none;
            border-radius: 0 0 8px 8px;
            display: none;
        }
        
        .collapsible-content.expanded {
            display: block;
        }
        
        .info-tooltip {
            display: inline-block;
            width: 16px;
            height: 16px;
            background: var(--info-color);
            color: white;
            border-radius: 50%;
            text-align: center;
            font-size: 12px;
            line-height: 16px;
            margin-left: 5px;
            cursor: help;
        }
        
        .api-settings {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin: 15px 0;
        }
        
        @media (min-width: 480px) {
            .api-settings {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        .api-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 8px;
            background: #e8f5e8;
            border: 1px solid #c8e6c9;
        }
        
        .api-status.error {
            background: #ffebee;
            border-color: #ffcdd2;
        }
        
        .status-text {
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success-color);
        }
        
        .status-dot.error {
            background: var(--danger-color);
        }
        
        .expand-button {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        
        .json-preview {
            background: #1a1a1a;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .table-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .generated-column {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .generated-column.expanded {
            white-space: normal;
            max-width: none;
            overflow: visible;
        }
        
        .toggle-expand {
            background: none;
            border: none;
            color: var(--info-color);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0 5px;
        }
        
        .processing-queue {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #e9ecef;
        }
        
        .queue-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #e9ecef;
        }
        
        .queue-item:last-child {
            border-bottom: none;
        }
        
        .queue-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .queue-status.pending {
            background: #6c757d;
        }
        
        .queue-status.processing {
            background: var(--warning-color);
            animation: pulse 1s infinite;
        }
        
        .queue-status.success {
            background: var(--success-color);
        }
        
        .queue-status.error {
            background: var(--danger-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 YC Email Generator</h1>
            <p class="subtitle">Bulk personalized email generation using Deepseek API</p>
            <div class="mobile-only" style="margin-top: 10px; font-size: 0.8rem;">
                <small>Optimized for mobile viewing</small>
            </div>
        </header>
        
        <div class="main-content">
            <!-- Left Panel: Controls and Input -->
            <div class="panel">
                <h2 class="panel-title">📊 Campaign Controls</h2>
                
                <div class="collapsible-section">
                    <div class="collapsible-header" onclick="toggleCollapsible('dataSection')">
                        <span>Data Input</span>
                        <span>▼</span>
                    </div>
                    <div class="collapsible-content expanded" id="dataSection">
                        <div class="input-group">
                            <label for="csvUpload">Upload YC Companies CSV</label>
                            <div class="upload-area" id="csvUploadArea">
                                <div class="upload-icon">📁</div>
                                <p>Drag & drop your CSV file here or click to browse</p>
                                <input type="file" id="csvFile" accept=".csv" style="display: none;">
                                <p class="company-count" id="companyCount">No file loaded</p>
                            </div>
                        </div>
                        
                        <div class="processing-queue" id="processingQueue" style="display: none;">
                            <h4 style="margin-bottom: 10px;">Processing Queue</h4>
                            <div id="queueList"></div>
                        </div>
                    </div>
                </div>
                
                <div class="collapsible-section">
                    <div class="collapsible-header" onclick="toggleCollapsible('apiSection')">
                        <span>API Configuration</span>
                        <span>▼</span>
                    </div>
                    <div class="collapsible-content" id="apiSection">
                        <div class="api-settings">
                            <div class="input-group">
                                <label for="apiKey">
                                    Deepseek API Key
                                    <span class="info-tooltip" title="Get your API key from platform.deepseek.com">?</span>
                                </label>
                                <input type="password" id="apiKey" placeholder="sk-...">
                            </div>
                            
                            <div class="input-group">
                                <label for="apiEndpoint">API Endpoint</label>
                                <select id="apiEndpoint">
                                    <option value="https://api.deepseek.com">api.deepseek.com</option>
                                    <option value="https://api.deepseek.ai">api.deepseek.ai</option>
                                    <option value="http://localhost:3000/proxy">Local Proxy</option>
                                </select>
                            </div>
                        </div>
                        
                        <div id="apiStatus" class="api-status">
                            <div class="status-dot"></div>
                            <div class="status-text">API: Not tested</div>
                        </div>
                    </div>
                </div>
                
                <div class="collapsible-section">
                    <div class="collapsible-header" onclick="toggleCollapsible('promptSection')">
                        <span>Prompt Template</span>
                        <span>▼</span>
                    </div>
                    <div class="collapsible-content" id="promptSection">
                        <div class="input-group">
                            <label for="customPrompt">Custom Prompt Template</label>
                            <textarea id="customPrompt" placeholder="Write a personalized email for {company_name} (YC {batch}).

I am Shal, founder of Remote Devs, helping YC companies not go broke haha.

Use ALL available information about this company from every column in the data:
- Batch: {batch}
- Location: {company_location}
- Current hiring status: {is_hiring}
- Team size: {team_size}
- Open positions: {number_of_open_jobs}
- Company description: {short_description}
- Tags/domain: {tags}
- Founder info: {founders/0/name}, {founders/0/email}
- Any other available data

Keep the email simple, quirky, and generate these four specific outputs:

1. Subject: Humorous and nice, less than 6 words
2. Intro Line: Just after "Hi [Name],"
3. Main Pitch: Utilize their team size, hiring requirements, nudge them if they're from older batches (pre-2025), mention cashflow issues, growth, valuation, and the value of hiring vetted remote devs for $50k/year
4. Closing Line: Less than 8 words, funny, with a clear call to action

IMPORTANT: Respond with ONLY a valid JSON object containing these exact four keys:
{
  "subject": "your subject line here",
  "intro_line": "your intro line here",
  "main_pitch": "your main pitch here",
  "closing_line": "your closing line here"
}

No additional text, no markdown, just the JSON.
</textarea>
                        </div>
                    </div>
                </div>
                
                <div class="collapsible-section">
                    <div class="collapsible-header" onclick="toggleCollapsible('rateSection')">
                        <span>Rate Control</span>
                        <span>▼</span>
                    </div>
                    <div class="collapsible-content" id="rateSection">
                        <div class="rate-control">
                            <label for="requestRate">Requests per minute:</label>
                            <input type="number" id="requestRate" min="1" max="60" step="1" value="30">
                            <small style="color: #666;">(1-60 requests per minute)</small>
                        </div>
                    </div>
                </div>
                
                <div class="control-buttons">
                    <button class="btn btn-primary" id="startBtn" onclick="startCampaign()">
                        <span>▶️</span> Start
                    </button>
                    <button class="btn btn-secondary" id="pauseBtn" onclick="togglePause()" disabled>
                        <span>⏸️</span> Pause
                    </button>
                    <button class="btn btn-danger" id="stopBtn" onclick="stopCampaign()" disabled>
                        <span>⏹️</span> Stop
                    </button>
                    <button class="btn btn-success" id="exportBtn" onclick="exportData()" disabled>
                        <span>📥</span> Export
                    </button>
                </div>
                
                <div class="campaign-status" id="campaignStatus">
                    <div class="status-indicator" id="statusIndicator"></div>
                    <span id="statusText">Campaign not started</span>
                </div>
                
                <div class="progress-section">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                        <label>Progress</label>
                        <span id="progressText">0/0</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
            </div>
            
            <!-- Right Panel: Stats and Output -->
            <div class="panel">
                <h2 class="panel-title">📈 Statistics & Results</h2>
                
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card">
                        <div class="stat-value" id="totalCompanies">0</div>
                        <div class="stat-label">Total</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="processed">0</div>
                        <div class="stat-label">Processed</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="successful">0</div>
                        <div class="stat-label">Successful</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="failed">0</div>
                        <div class="stat-label">Failed</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="remaining">0</div>
                        <div class="stat-label">Remaining</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="apiCost">$0.00</div>
                        <div class="stat-label">Est. Cost</div>
                    </div>
                </div>
                
                <div class="charts-container">
                    <div class="chart-box">
                        <canvas id="progressChart"></canvas>
                    </div>
                    <div class="chart-box">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
                
                <div id="logContainer">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <h3 style="font-size: 1.1rem; margin: 0;">📝 Activity Log</h3>
                        <button onclick="clearLog()" style="padding: 5px 10px; font-size: 0.8rem; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">Clear</button>
                    </div>
                    <div class="log-container" id="logOutput"></div>
                </div>
            </div>
        </div>
        
        <!-- Data Table Section -->
        <div class="data-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 class="panel-title" style="border: none; padding: 0; margin: 0;">📋 Generated Email Data</h2>
                <div class="table-actions">
                    <button onclick="exportData()" style="padding: 8px 15px; font-size: 0.9rem; background: var(--success-color); color: white; border: none; border-radius: 6px; cursor: pointer;">📊 Download CSV</button>
                </div>

                        <!-- Data will be populated here -->
                    </tbody>

            <div id="tablePlaceholder" style="text-align: center; padding: 40px; color: #6c757d;">
                <p>No data available. Upload a CSV file and start the campaign.</p>
            </div>

    </div>

    <!-- CORS Proxy Modal -->
    <div id="proxyModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; padding: 25px; border-radius: 15px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto;">
            <h2 style="margin-bottom: 15px; color: var(--danger-color);">⚠️ CORS Issue Detected</h2>
            <p style="margin-bottom: 15px;">The browser is blocking direct API calls to Deepseek. This is a security feature called CORS.</p>
            
            <div style="background: #e8f4f8; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                <h4 style="margin-bottom: 10px; color: var(--info-color);">Recommended Solutions:</h4>
                <ol style="padding-left: 20px; margin-bottom: 10px;">
                    <li style="margin-bottom: 8px;"><strong>Use a CORS Proxy:</strong> Add this URL to your API endpoint: <code>https://corsproxy.io/?</code></li>
                    <li style="margin-bottom: 8px;"><strong>Run Local Proxy:</strong> Install and run a simple proxy server</li>
                    <li><strong>Browser Extension:</strong> Install a CORS extension (not recommended for security)</li>
                </ol>
            </div>
            
            <div class="input-group">
                <label for="corsProxyUrl">CORS Proxy URL (optional):</label>
                <input type="text" id="corsProxyUrl" placeholder="https://corsproxy.io/?" value="https://corsproxy.io/?">
                <small style="color: #666;">This will be prepended to the API endpoint</small>
            </div>
            
            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                <button onclick="useCorsProxy()" style="padding: 10px 20px; background: var(--success-color); color: white; border: none; border-radius: 6px; cursor: pointer;">Use Proxy</button>
                <button onclick="document.getElementById('proxyModal').style.display = 'none'" style="padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 6px; cursor: pointer;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let companiesData = [];
        let processedData = [];
        let campaignActive = false;
        let campaignPaused = false;
        let currentIndex = 0;
        let requestInterval = null;
        let charts = {};
        let corsProxy = '';
        let originalHeaders = [];
        let generatedFields = new Set(['_status', '_processedAt', '_error']);
        let processingQueue = new Set(); // Track which companies are currently being processed
        
        // Chart colors
        const chartColors = {
            primary: 'hsl(158 65% 25%)',
            secondary: 'hsl(45 70% 55%)',
            success: 'hsl(158 65% 35%)',
            danger: 'hsl(0 70% 55%)',
            warning: 'hsl(45 70% 55%)',
            info: 'hsl(200 70% 55%)'
        };
        
        // Initialize charts
        function initializeCharts() {
            const progressCtx = document.getElementById('progressChart').getContext('2d');
            const statusCtx = document.getElementById('statusChart').getContext('2d');
            
            // Destroy existing charts
            if (charts.progress) charts.progress.destroy();
            if (charts.status) charts.status.destroy();
            
            charts.progress = new Chart(progressCtx, {
                type: 'line',
                data: {
                    labels: ['Start'],
                    datasets: [{
                        label: 'Processed Companies',
                        data: [0],
                        borderColor: chartColors.primary,
                        backgroundColor: chartColors.primary + '20',
                        tension: 0.4,
                        fill: true,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                font: {
                                    size: window.innerWidth < 768 ? 10 : 12
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                font: {
                                    size: window.innerWidth < 768 ? 10 : 12
                                }
                            }
                        },
                        x: {
                            ticks: {
                                font: {
                                    size: window.innerWidth < 768 ? 10 : 12
                                }
                            }
                        }
                    }
                }
            });
            
            charts.status = new Chart(statusCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Successful', 'Failed', 'Pending'],
                    datasets: [{
                        data: [0, 0, 0],
                        backgroundColor: [
                            chartColors.success,
                            chartColors.danger,
                            chartColors.info
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                font: {
                                    size: window.innerWidth < 768 ? 10 : 12
                                }
                            }
                        }
                    }
                }
            });
        }
        
        // Update charts
        function updateCharts() {
            if (!charts.progress || !charts.status) return;
            
            const processedCount = processedData.length;
            const total = companiesData.length;
            
            // Update progress chart
            if (charts.progress.data.labels.length > 20) {
                charts.progress.data.labels.shift();
                charts.progress.data.datasets[0].data.shift();
            }
            charts.progress.data.labels.push(`#${processedCount}`);
            charts.progress.data.datasets[0].data.push(processedCount);
            charts.progress.update();
            
            // Update status chart
            const successful = processedData.filter(c => c._status === 'success').length;
            const failed = processedData.filter(c => c._status === 'error').length;
            const pending = total - processedCount - processingQueue.size;
            
            charts.status.data.datasets[0].data = [successful, failed, pending];
            charts.status.update();
        }
        
        // Update statistics
        function updateStats() {
            const total = companiesData.length;
            const processed = processedData.length;
            const successful = processedData.filter(c => c._status === 'success').length;
            const failed = processedData.filter(c => c._status === 'error').length;
            const remaining = total - processed - processingQueue.size;
            
            // Estimate cost (Deepseek pricing: ~$0.0005 per 1K tokens)
            const estimatedCost = (processed * 0.0005).toFixed(4);
            
            document.getElementById('totalCompanies').textContent = total;
            document.getElementById('processed').textContent = processed;
            document.getElementById('successful').textContent = successful;
            document.getElementById('failed').textContent = failed;
            document.getElementById('remaining').textContent = remaining;
            document.getElementById('apiCost').textContent = `$${estimatedCost}`;
            
            // Update progress bar
            const progressPercent = total > 0 ? (processed / total) * 100 : 0;
            document.getElementById('progressFill').style.width = `${progressPercent}%`;
            document.getElementById('progressText').textContent = `${processed}/${total}`;
            
            updateCharts();
        }
        
        // Update processing queue display
        function updateQueueDisplay() {
            const queueList = document.getElementById('queueList');
            const queueContainer = document.getElementById('processingQueue');
            
            if (processingQueue.size === 0) {
                queueContainer.style.display = 'none';
                return;
            }
            
            queueContainer.style.display = 'block';
            queueList.innerHTML = '';
            
            processingQueue.forEach(companyId => {
                const company = companiesData.find(c => c._id === companyId);
                if (!company) return;
                
                const queueItem = document.createElement('div');
                queueItem.className = 'queue-item';
                queueItem.innerHTML = `
                    <div style="display: flex; align-items: center;">
                        <div class="queue-status processing"></div>
                        <span>${company.company_name || company.name || `Company ${company._id}`}</span>
                    </div>
                    <span style="color: var(--warning-color); font-size: 0.8rem;">Processing...</span>
                `;
                queueList.appendChild(queueItem);
            });
        }
        
        // Log function
        function log(message, type = 'info') {
            const logOutput = document.getElementById('logOutput');
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            if (!logOutput) return;
            
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `
                <span class="log-time">[${time}]</span>
                <span class="log-${type}"> ${message}</span>
            `;
            
            logOutput.appendChild(logEntry);
            logOutput.scrollTop = logOutput.scrollHeight;
        }
        
        // Clear log
        function clearLog() {
            const logOutput = document.getElementById('logOutput');
            if (logOutput) {
                logOutput.innerHTML = '';
            }
        }
        
        // Parse CSV file
        function parseCSV(file) {
            return new Promise((resolve, reject) => {
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        if (results.errors.length > 0) {
                            log('CSV parsing errors: ' + JSON.stringify(results.errors), 'error');
                        }
                        originalHeaders = results.meta.fields || [];
                        resolve(results.data);
                    },
                    error: (error) => {
                        reject(error);
                    }
                });
            });
        }
        
        // Upload CSV handler
        document.getElementById('csvUploadArea').addEventListener('click', () => {
            document.getElementById('csvFile').click();
        });
        
        document.getElementById('csvFile').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            
            try {
                log(`Loading CSV file: ${file.name}`, 'info');
                const rawData = await parseCSV(file);
                
                // Store original data as-is
                companiesData = rawData.map((company, index) => {
                    return {
                        _id: index + 1,
                        ...company,
                        _status: 'pending',
                        _error: null,
                        _processedAt: null
                    };
                });
                
                document.getElementById('companyCount').textContent = 
                    `Loaded ${companiesData.length} companies`;
                
                // Reset processed data
                processedData = [];
                currentIndex = 0;
                processingQueue.clear();
                
                // Update UI
                updateTable();
                updateStats();
                updateQueueDisplay();
                
                // Enable export button if we have data
                document.getElementById('exportBtn').disabled = companiesData.length === 0;
                
                log(`Successfully loaded ${companiesData.length} companies`, 'success');
            } catch (error) {
                log(`Error loading CSV: ${error.message}`, 'error');
                alert('Error loading CSV file. Please check the file format.');
            }
        });
        
        // Update results table with dynamic columns
        function updateTable() {
            const tableHeader = document.getElementById('tableHeader');
            const tableBody = document.getElementById('tableBody');
            const placeholder = document.getElementById('tablePlaceholder');
            
            tableHeader.innerHTML = '';
            tableBody.innerHTML = '';
            
            if (processedData.length === 0 && companiesData.length === 0) {
                placeholder.style.display = 'block';
                return;
            }
            
            placeholder.style.display = 'none';
            
            // Get all unique headers from processed data AND original data
            const allHeaders = new Set();
            
            // Add original headers
            if (originalHeaders.length > 0) {
                originalHeaders.forEach(header => allHeaders.add(header));
            }
            
            // Add generated fields from processed data
            processedData.forEach(item => {
                Object.keys(item).forEach(key => {
                    if (key.startsWith('_generated_')) {
                        allHeaders.add(key);
                    }
                });
            });
            
            // Convert to array and sort
            const headers = [...allHeaders].sort((a, b) => {
                // Put generated fields at the end
                if (a.startsWith('_generated_') && !b.startsWith('_generated_')) return 1;
                if (!a.startsWith('_generated_') && b.startsWith('_generated_')) return -1;
                return a.localeCompare(b);
            });
            
            // Create header row
            const headerRow = document.createElement('tr');
            
            // Add index column
            const indexTh = document.createElement('th');
            indexTh.textContent = '#';
            headerRow.appendChild(indexTh);
            
            // Add data headers
            headers.forEach(header => {
                const th = document.createElement('th');
                th.textContent = header.replace(/^_generated_/, '').replace(/^_/, '');
                headerRow.appendChild(th);
            });
            
            // Add status and action columns
            const statusTh = document.createElement('th');
            statusTh.textContent = 'Status';
            headerRow.appendChild(statusTh);
            
            const actionTh = document.createElement('th');
            actionTh.textContent = 'View';
            headerRow.appendChild(actionTh);
            
            tableHeader.appendChild(headerRow);
            
            // Create data rows - show processed data first, then pending
            const displayData = [...processedData];
            const pendingCompanies = companiesData.filter(c => 
                c._status === 'pending' && !displayData.find(d => d._id === c._id)
            );
            
            // Add pending companies
            pendingCompanies.forEach(company => {
                displayData.push({...company});
            });
            
            // Sort by ID
            displayData.sort((a, b) => a._id - b._id);
            
            // Create rows
            displayData.forEach((company, index) => {
                const row = document.createElement('tr');
                
                // Add index cell
                const indexCell = document.createElement('td');
                indexCell.textContent = company._id;
                row.appendChild(indexCell);
                
                // Add data cells for each header
                headers.forEach(header => {
                    const cell = document.createElement('td');
                    const value = company[header];
                    
                    if (value === null || value === undefined) {
                        cell.textContent = '-';
                    } else if (typeof value === 'object') {
                        cell.textContent = JSON.stringify(value);
                    } else {
                        const text = String(value);
                        // Check if this is a generated field that might be long
                        if (header.startsWith('_generated_') && text.length > 50) {
                            cell.className = 'generated-column';
                            cell.innerHTML = `
                                <span class="short-text">${text.substring(0, 50)}...</span>
                                <button class="toggle-expand" onclick="toggleExpand(this)">More</button>
                                <span class="full-text" style="display: none;">${text}</span>
                            `;
                        } else {
                            cell.textContent = text.length > 100 ? text.substring(0, 100) + '...' : text;
                            cell.title = text;
                        }
                    }
                    
                    row.appendChild(cell);
                });
                
                // Add status cell
                const statusCell = document.createElement('td');
                if (company._status === 'success') {
                    statusCell.innerHTML = '<span style="color: var(--success-color); font-weight: bold;">✓</span>';
                } else if (company._status === 'error') {
                    statusCell.innerHTML = `<span style="color: var(--danger-color); font-weight: bold;">✗</span>`;
                } else if (processingQueue.has(company._id)) {
                    statusCell.innerHTML = '<span style="color: var(--warning-color);">🔄</span>';
                } else {
                    statusCell.innerHTML = '<span style="color: #6c757d;">⏳</span>';
                }
                row.appendChild(statusCell);
                
                // Add action cell
                const actionCell = document.createElement('td');
                if (company._status === 'success' || company._status === 'error') {
                    const viewButton = document.createElement('button');
                    viewButton.className = 'expand-button';
                    viewButton.textContent = '📄';
                    viewButton.onclick = () => showCompanyDetails(company);
                    actionCell.appendChild(viewButton);
                }
                row.appendChild(actionCell);
                
                tableBody.appendChild(row);
            });
        }
        
        // Toggle expand/collapse for long text
        function toggleExpand(button) {
            const cell = button.closest('td');
            const shortText = cell.querySelector('.short-text');
            const fullText = cell.querySelector('.full-text');
            
            if (cell.classList.contains('expanded')) {
                cell.classList.remove('expanded');
                shortText.style.display = 'inline';
                fullText.style.display = 'none';
                button.textContent = 'More';
            } else {
                cell.classList.add('expanded');
                shortText.style.display = 'none';
                fullText.style.display = 'inline';
                button.textContent = 'Less';
            }
        }
        
        // Show company details in modal
        function showCompanyDetails(company) {
            // Create modal
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.5);
                z-index: 1000;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            `;
            
            const modalContent = document.createElement('div');
            modalContent.style.cssText = `
                background: white;
                padding: 25px;
                border-radius: 15px;
                max-width: 800px;
                width: 100%;
                max-height: 90vh;
                overflow-y: auto;
            `;
            
            // Create header
            const header = document.createElement('div');
            header.style.cssText = `
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 20px;
            `;
            
            const title = document.createElement('h2');
            title.textContent = company.company_name || company.name || `Company ${company._id}`;
            title.style.cssText = 'margin: 0; color: var(--primary-color);';
            
            const closeButton = document.createElement('button');
            closeButton.textContent = '✕';
            closeButton.style.cssText = `
                background: var(--danger-color);
                color: white;
                border: none;
                border-radius: 4px;
                width: 30px;
                height: 30px;
                cursor: pointer;
                font-size: 16px;
            `;
            closeButton.onclick = () => document.body.removeChild(modal);
            
            header.appendChild(title);
            header.appendChild(closeButton);
            
            // Create JSON preview
            const previewTitle = document.createElement('h3');
            previewTitle.textContent = 'Generated Data';
            previewTitle.style.cssText = 'margin: 20px 0 10px 0;';
            
            const jsonPreview = document.createElement('div');
            jsonPreview.className = 'json-preview';
            
            // Filter and organize data
            const displayData = {
                original: {},
                generated: {},
                metadata: {}
            };
            
            Object.keys(company).forEach(key => {
                if (key.startsWith('_generated_')) {
                    displayData.generated[key.replace('_generated_', '')] = company[key];
                } else if (key.startsWith('_')) {
                    displayData.metadata[key] = company[key];
                } else {
                    displayData.original[key] = company[key];
                }
            });
            
            jsonPreview.textContent = JSON.stringify(displayData, null, 2);
            
            // Create copy button
            const copyButton = document.createElement('button');
            copyButton.textContent = '📋 Copy JSON';
            copyButton.style.cssText = `
                margin-top: 15px;
                padding: 10px 20px;
                background: var(--info-color);
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.9rem;
            `;
            copyButton.onclick = () => {
                navigator.clipboard.writeText(JSON.stringify(displayData, null, 2))
                    .then(() => alert('JSON copied to clipboard!'))
                    .catch(err => console.error('Failed to copy:', err));
            };
            
            // Assemble modal
            modalContent.appendChild(header);
            modalContent.appendChild(previewTitle);
            modalContent.appendChild(jsonPreview);
            modalContent.appendChild(copyButton);
            modal.appendChild(modalContent);
            
            // Close on ESC key
            const closeOnEsc = (e) => {
                if (e.key === 'Escape') {
                    document.body.removeChild(modal);
                    document.removeEventListener('keydown', closeOnEsc);
                }
            };
            
            document.addEventListener('keydown', closeOnEsc);
            
            // Add to document
            document.body.appendChild(modal);
            
            // Close on background click
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    document.body.removeChild(modal);
                    document.removeEventListener('keydown', closeOnEsc);
                }
            });
        }
        
        // Export data as CSV
        function exportData() {
            if (processedData.length === 0) {
                alert('No data to export');
                return;
            }
            
            // Get all headers
            const allHeaders = new Set();
            processedData.forEach(item => {
                Object.keys(item).forEach(key => {
                    if (!key.startsWith('_') || key === '_status' || key === '_error' || key.startsWith('_generated_')) {
                        allHeaders.add(key);
                    }
                });
            });
            
            const headers = [...allHeaders];
            const csvRows = [];
            
            // Add header row
            csvRows.push(headers.map(h => `"${h}"`).join(','));
            
            // Add data rows
            processedData.forEach(company => {
                const row = headers.map(header => {
                    const value = company[header];
                    if (value === null || value === undefined) return '""';
                    if (typeof value === 'object') {
                        return `"${JSON.stringify(value).replace(/"/g, '""')}"`;
                    }
                    return `"${String(value).replace(/"/g, '""')}"`;
                });
                csvRows.push(row.join(','));
            });
            
            const csvContent = csvRows.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `yc_generated_data_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            
            URL.revokeObjectURL(url);
            log(`CSV data exported (${processedData.length} entries)`, 'success');
        }
        
        // Generate prompt for a company
        function generatePrompt(company, customPrompt) {
            let prompt = customPrompt;
            
            // Replace all placeholders with company data
            Object.keys(company).forEach(key => {
                if (!key.startsWith('_')) {
                    const placeholder = `{${key}}`;
                    if (prompt.includes(placeholder)) {
                        prompt = prompt.replace(new RegExp(placeholder, 'g'), String(company[key] || ''));
                    }
                }
            });
            
            // Common placeholders
            prompt = prompt.replace(/{company_name}/g, company.company_name || company.name || '');
            prompt = prompt.replace(/{batch}/g, company.batch || '');
            prompt = prompt.replace(/{short_description}/g, company.short_description || '');
            prompt = prompt.replace(/{is_hiring}/g, company.is_hiring || '');
            prompt = prompt.replace(/{is_hiring_status}/g, 
                company.is_hiring === 'true' ? 'actively hiring' : 'not currently hiring');
            prompt = prompt.replace(/{tags}/g, company.tags || '');
            prompt = prompt.replace(/{email}/g, company.email || '');
            
            return prompt;
        }
        
        // Test API connection
        async function testAPIConnection() {
            const apiKey = document.getElementById('apiKey').value;
            if (!apiKey) return false;
            
            try {
                const endpoint = document.getElementById('apiEndpoint').value;
                const testUrl = corsProxy ? `${corsProxy}${endpoint}/v1/models` : `${endpoint}/v1/models`;
                
                const response = await fetch(testUrl, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                return response.ok;
            } catch (error) {
                return false;
            }
        }
        
        // Call Deepseek API with CORS proxy support
        async function callDeepseekAPI(company, prompt) {
            const apiKey = document.getElementById('apiKey').value;
            if (!apiKey) {
                throw new Error('API key not provided');
            }
            
            const endpoint = document.getElementById('apiEndpoint').value;
            const apiUrl = `${endpoint}/v1/chat/completions`;
            const url = corsProxy ? `${corsProxy}${encodeURIComponent(apiUrl)}` : apiUrl;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            {
                                role: 'user',
                                content: prompt
                            }
                        ],
                        temperature: 0.7,
                        max_tokens: 500,
                        stream: false
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`API error ${response.status}: ${errorText.substring(0, 100)}`);
                }
                
                const data = await response.json();
                
                if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                    throw new Error('Invalid API response format');
                }
                
                return data.choices[0].message.content;
            } catch (error) {
                // Check if it's a CORS error
                if (error.message.includes('Failed to fetch') || error.message.includes('CORS')) {
                    showCorsModal();
                    throw new Error('CORS error - Please configure a proxy');
                }
                throw error;
            }
        }
        
        // Show CORS modal
        function showCorsModal() {
            document.getElementById('proxyModal').style.display = 'flex';
        }
        
        // Use CORS proxy
        function useCorsProxy() {
            corsProxy = document.getElementById('corsProxyUrl').value;
            if (corsProxy && !corsProxy.endsWith('/') && !corsProxy.endsWith('?')) {
                corsProxy += '/';
            }
            document.getElementById('proxyModal').style.display = 'none';
            log('CORS proxy configured: ' + corsProxy, 'success');
        }
        
        // Process a single company
        async function processCompany(company) {
            const customPrompt = document.getElementById('customPrompt').value;
            
            try {
                log(`Processing ${company.company_name || company.name || `Company ${company._id}`}`, 'info');
                
                const prompt = generatePrompt(company, customPrompt);
                const response = await callDeepseekAPI(company, prompt);
                
                // Try to parse JSON from response
                let generatedData = {};
                try {
                    // Look for JSON in the response
                    const jsonMatch = response.match(/\{[\s\S]*\}/);
                    if (jsonMatch) {
                        generatedData = JSON.parse(jsonMatch[0]);
                    } else {
                        // If no JSON, treat the whole response as text
                        generatedData = { content: response.trim() };
                    }
                } catch (e) {
                    // If JSON parsing fails, use the raw response
                    generatedData = { content: response.trim() };
                }
                
                // Add generated data to company with _generated_ prefix
                Object.keys(generatedData).forEach(key => {
                    company[`_generated_${key}`] = generatedData[key];
                });
                
                company._status = 'success';
                company._processedAt = new Date().toISOString();
                
                // Remove from processing queue
                processingQueue.delete(company._id);
                
                // Add to processed data
                processedData.push({...company});
                
                log(`✓ Successfully processed`, 'success');
            } catch (error) {
                log(`✗ Error: ${error.message}`, 'error');
                
                company._status = 'error';
                company._error = error.message;
                company._processedAt = new Date().toISOString();
                
                // Remove from processing queue
                processingQueue.delete(company._id);
                
                // Add to processed data
                processedData.push({...company});
                
                // Show CORS modal on first CORS error
                if (error.message.includes('CORS') && !corsProxy) {
                    showCorsModal();
                }
            }
            
            // Update UI
            updateTable();
            updateStats();
            updateQueueDisplay();
        }
        
        // Start campaign
        async function startCampaign() {
            if (companiesData.length === 0) {
                alert('Please upload a CSV file first');
                return;
            }
            
            const apiKey = document.getElementById('apiKey').value;
            if (!apiKey) {
                alert('Please enter your Deepseek API key');
                return;
            }
            
            // Test API connection
            log('Testing API connection...', 'info');
            const apiTest = await testAPIConnection();
            if (!apiTest && !corsProxy) {
                const useProxy = confirm('API connection failed. This might be due to CORS restrictions. Would you like to configure a CORS proxy?');
                if (useProxy) {
                    showCorsModal();
                    return;
                }
            }
            
            campaignActive = true;
            campaignPaused = false;
            
            // Update UI
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('csvFile').disabled = true;
            
            document.getElementById('statusIndicator').className = 'status-indicator status-active';
            document.getElementById('statusText').textContent = 'Campaign running';
            
            log('Campaign started', 'success');
            
            // Start processing
            processNextBatch();
        }
        
        // Process next batch of companies
        async function processNextBatch() {
            if (!campaignActive || campaignPaused) return;
            
            // Find next pending company that's not already being processed
            const pendingCompany = companiesData.find(c => 
                c._status === 'pending' && 
                !processedData.find(p => p._id === c._id) &&
                !processingQueue.has(c._id)
            );
            
            if (!pendingCompany) {
                // Check if we still have companies in the queue
                if (processingQueue.size === 0) {
                    stopCampaign();
                    log('🎉 Campaign completed! All companies processed.', 'success');
                }
                return;
            }
            
            // Add to processing queue
            processingQueue.add(pendingCompany._id);
            updateQueueDisplay();
            
            // Process this company
            await processCompany(pendingCompany);
            
            // Schedule next request based on rate
            const rate = parseFloat(document.getElementById('requestRate').value) || 30;
            const delay = rate > 0 ? (60000 / rate) : 0; // Convert to requests per minute
            
            if (delay > 0 && campaignActive && !campaignPaused) {
                setTimeout(processNextBatch, delay);
            } else if (rate === 0) {
                log('Rate is set to 0. Campaign paused.', 'warning');
                togglePause();
            }
        }
        
        // Toggle pause
        function togglePause() {
            campaignPaused = !campaignPaused;
            
            const pauseBtn = document.getElementById('pauseBtn');
            const statusIndicator = document.getElementById('statusIndicator');
            
            if (campaignPaused) {
                pauseBtn.innerHTML = '<span>▶️</span> Resume';
                statusIndicator.className = 'status-indicator status-paused';
                document.getElementById('statusText').textContent = 'Campaign paused';
                log('Campaign paused', 'warning');
            } else {
                pauseBtn.innerHTML = '<span>⏸️</span> Pause';
                statusIndicator.className = 'status-indicator status-active';
                document.getElementById('statusText').textContent = 'Campaign running';
                log('Campaign resumed', 'success');
                processNextBatch();
            }
        }
        
        // Stop campaign
        function stopCampaign() {
            campaignActive = false;
            campaignPaused = false;
            
            // Update UI
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('csvFile').disabled = false;
            
            document.getElementById('statusIndicator').className = 'status-indicator';
            document.getElementById('statusText').textContent = 'Campaign stopped';
            
            // Clear processing queue
            processingQueue.clear();
            updateQueueDisplay();
            
            log('Campaign stopped', 'warning');
        }
        
        // Toggle collapsible sections
        function toggleCollapsible(sectionId) {
            const content = document.getElementById(sectionId);
            const header = content.previousElementSibling;
            const arrow = header.querySelector('span:last-child');
            
            content.classList.toggle('expanded');
            arrow.textContent = content.classList.contains('expanded') ? '▼' : '▶';
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initializeCharts();
            
            // Drag and drop for CSV
            const uploadArea = document.getElementById('csvUploadArea');
            
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = chartColors.primary;
                uploadArea.style.background = '#f0f0ff';
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.borderColor = '#adb5bd';
                uploadArea.style.background = 'white';
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#adb5bd';
                uploadArea.style.background = 'white';
                
                const file = e.dataTransfer.files[0];
                if (file && (file.type === 'text/csv' || file.name.endsWith('.csv'))) {
                    document.getElementById('csvFile').files = e.dataTransfer.files;
                    document.getElementById('csvFile').dispatchEvent(new Event('change'));
                } else {
                    alert('Please drop a CSV file');
                }
            });
            
            // Initialize all collapsible sections as expanded on desktop
            if (window.innerWidth >= 768) {
                const sections = ['dataSection', 'apiSection', 'promptSection', 'rateSection'];
                sections.forEach(section => {
                    const content = document.getElementById(section);
                    if (content) {
                        content.classList.add('expanded');
                        const header = content.previousElementSibling;
                        const arrow = header.querySelector('span:last-child');
                        arrow.textContent = '▼';
                    }
                });
            }
            
            // Handle window resize
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    initializeCharts();
                }, 250);
            });
        });
    </script>
</body>
